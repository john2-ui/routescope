[package]
name = "routescope"
version = "0.1.0"
edition = "2024"

[dependencies]
askama = "0.16.0"
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "time"] }
rusqlite = {version = "0.32", features = ["bundled"]}

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }